# Loop rehearsal: start from IAM-tuned handwritten Base. Do not use stage1 here.
model_name_or_path: microsoft/trocr-base-handwritten
output_dir: runs/base_handwritten_v1
train_dir: data/iam_line/train
val_dir: data/iam_line/validation
max_target_length: 128
generation_max_length: 128
generation_num_beams: 1
per_device_train_batch_size: 8
per_device_eval_batch_size: 4
gradient_accumulation_steps: 2
learning_rate: 2.0e-5
lr_scheduler_type: cosine
warmup_ratio: 0.05
num_train_epochs: 2
eval_strategy: steps
eval_steps: 200
save_steps: 200
logging_steps: 20
save_total_limit: 3
dataloader_num_workers: 2
bf16: true
fp16: false
augment: true
mix_private: false
test_dir: data/iam_line/test
test_num_beams: 4
metric_for_best_model: cer
torch_empty_cache_steps: 50
report_to:
  - tensorboard
