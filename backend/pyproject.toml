[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "handwriting-backend"
version = "1.0.0"
description = "FastAPI Inference Backend & Serving Architecture for Handwriting Recognition"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Engineering Team", email = "engineering@example.com" }
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "python-multipart>=0.0.9",
    "sse-starlette>=2.0.0",
    "pypdfium2>=4.30.0",
    "pillow>=10.2.0",
    "numpy>=1.26.0",
    "opencv-python-headless>=4.9.0",
    "scipy>=1.12.0",
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "transformers>=4.38.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "black>=24.0.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
]
